<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI ADS™ — Autonomous Content Intelligence &amp; 8K Creative Studio</title>
    <meta name="description" content="AI ADS™ learns your Brand DNA, plans your 30-day strategy, renders photorealistic 8K ad creatives, and publishes across every channel — with human approval built in." />
    
    <!-- Open Graph SEO Meta Tags -->
    <meta property="og:title" content="AI ADS™ — Autonomous Content Intelligence &amp; 8K Creative Studio" />
    <meta property="og:description" content="Create on-brand ads &amp; content faster without losing your brand voice. 30-day campaign strategy, 8K photorealistic renders, and multi-channel publishing." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://aiads.com" />
    <meta property="og:image" content="/logo_transparent.png" />
    
    <!-- Google Fonts Inter & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Razorpay SDK -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('aisa_theme');
          var theme = saved || 'dark';
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F8F9FD] dark:bg-[#090d16] text-slate-900 dark:text-slate-100 antialiased selection:bg-[#7B61FF] selection:text-white font-sans min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
